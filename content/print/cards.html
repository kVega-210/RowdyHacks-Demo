<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HEIST HAVOC! card faces (print A4)</title>
<style>
  /* PH-05: open in a browser, Print -> A4, 100% scale, margins "none" or default. 9 cards per page (63x88mm). */
  @page { size: A4; margin: 8mm; }
  body { margin: 0; font-family: system-ui, sans-serif; }
  .sheet { display: grid; grid-template-columns: repeat(3, 63mm); grid-auto-rows: 88mm; gap: 3mm; justify-content: center; }
  .card { border: 0.4mm dashed #888; border-radius: 4mm; padding: 5mm; box-sizing: border-box; display: flex; flex-direction: column; break-inside: avoid; position: relative; overflow: hidden; }
  .num { font: 900 26pt ui-monospace, monospace; }
  .type { font-size: 8pt; letter-spacing: .15em; text-transform: uppercase; color: #555; }
  .title { font-weight: 900; font-size: 15pt; margin: 2mm 0; }
  .text { font-size: 10.5pt; line-height: 1.3; flex: 1; }
  .opt { font-size: 7.5pt; color: #333; border-top: 0.3mm solid #ccc; padding-top: 1.5mm; }
  .stripe { position: absolute; top: 0; right: 0; width: 9mm; height: 100%; }
  .dare .stripe { background: #ff5c7a; } .workout .stripe { background: #3dff9a; } .double-or-nothing .stripe { background: #ffd84d; }
  .shield .stripe { background: #4dd2ff; } .steal-boost .stripe { background: #c77dff; }
  .back { background: #0b0f1a; color: #ffd84d; align-items: center; justify-content: center; text-align: center; }
  .back b { font-size: 22pt; letter-spacing: .08em; } .back small { color: #8fa1c7; margin-top: 3mm; }
  h1 { font-size: 11pt; text-align: center; margin: 0 0 4mm; } .pb { break-before: page; }
</style>
</head>
<body>
<h1>HEIST HAVOC! cards: cut on the dashed lines. Print the back sheet on the reverse (flip on long edge).</h1>
<div class="sheet" id="faces"></div>
<div class="pb"></div>
<div class="sheet" id="backs"></div>
<script>
fetch('/content/cards.json').then((r) => r.json()).then(({ cards }) => {
  const faces = document.getElementById('faces');
  for (const c of cards) {
    const d = document.createElement('div');
    d.className = 'card ' + c.type;
    d.innerHTML = `<div class="stripe"></div><div class="num">#${c.number}</div><div class="type">${c.type.replace(/-/g, ' ')}</div>
      <div class="title"></div><div class="text"></div><div class="opt"></div>`;
    d.querySelector('.title').textContent = c.title;
    d.querySelector('.text').textContent = c.text;
    d.querySelector('.opt').textContent = 'Enter #' + c.number + ' on your phone. ' + c.optOut;
    faces.append(d);
  }
  const backs = document.getElementById('backs');
  for (let i = 0; i < cards.length; i++) {
    const d = document.createElement('div');
    d.className = 'card back';
    d.innerHTML = '<b>HEIST<br>HAVOC!</b><small>draw between rounds</small>';
    backs.append(d);
  }
});
</script>
</body>
</html>
